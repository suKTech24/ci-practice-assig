name: CI Pipeline Practice
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      # TASK 1 : Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7
      # TASK 2 : Cache npm's download cache (~/.npm), not node_modules
      # Cache action: https://github.com/marketplace/actions/cache
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          # npm's global download cache on Linux/macOS runners
          path: ~/.npm
          # Exact key: OS + fingerprint of package.json.
          # Editing dependencies in package.json changes the hash -> new cache.
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          # Fallback: if no exact match, reuse the newest cache for this OS.
          restore-keys: |
            ${{ runner.os }}-npm-

      # TASK 3 : Install, run tests, and save the output to a file
      - name: Install & Test
        run: npm install && npm test > test-output.txt

      # TASK 3 : Upload the test output so it can be downloaded later
      # Upload artifact action: https://github.com/marketplace/actions/upload-a-build-artifact
      - name: Upload test results
        if: always()  # upload even when tests fail, so you can read why
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-output.txt

      # TASK 4 : Open a GitHub Issue when an earlier step fails.
      # Keep this as the LAST step so it sees failures from every step above.
      # github-script action: https://github.com/marketplace/actions/github-script
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace('refs/heads/', '');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow failed on ${branch}`,
              body: `The workflow **${context.workflow}** failed.\n\n- **Commit:** ${context.sha}\n- **Branch:** ${branch}\n- **Run:** [View logs](${runUrl})`
            });
