name: Bug report
description: Report something that isn't working as expected.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        **Security vulnerabilities must not be reported here.** See SECURITY.md.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I agree to follow this organization's Code of Conduct.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag, commit SHA, or workflow template name.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, runner type, and so on.
      placeholder: "OS: ubuntu-24.04, Node: 22.x"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant output. It is formatted as code automatically. Remove secrets first.
      render: shell
