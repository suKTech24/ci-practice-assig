# Marks inactive issues and pull requests as stale, then closes them.
# Customize: day counts, messages, and exempt labels.
name: Stale

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,roadmap
          exempt-pr-labels: pinned,security
          exempt-draft-pr: true
          stale-issue-message: >
            This issue has had no activity for 60 days and is now marked stale.
            It will be closed in 14 days unless there is new activity.
          stale-pr-message: >
            This pull request has had no activity for 60 days and is now marked
            stale. It will be closed in 14 days unless there is new activity.
